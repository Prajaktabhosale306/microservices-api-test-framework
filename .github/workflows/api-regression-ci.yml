# ==============================================================================
# GitHub Actions CI/CD Pipeline: Distributed API Test Regression, Load & Reporting
# ==============================================================================

name: API Microservices Regression CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  api-automation-test:
    name: Build Services & Execute Newman + k6 Suite
    runs-on: ubuntu-latest

    steps:
      # Step 1: Pull repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Configure Node.js runtime environment
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Install root development tools
      - name: Install Framework Dependencies
        run: npm ci || npm install

      # Step 4: Install Grafana k6 via official action (No GPG keyserver errors)
      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      # Step 5: Orchestrate microservice containers
      - name: Spin up Microservices Cluster (Docker Compose)
        run: |
          docker compose up --build -d
          echo "Waiting for API Gateway to pass health check on port 8080..."
          timeout 30s bash -c 'until curl -sf http://localhost:8080/health; do sleep 1; done'
          echo "Cluster is healthy and ready for traffic."

      # Step 6: Execute Newman functional regression tests
      - name: Execute Newman Automation Tests
        run: |
          mkdir -p reports
          npx newman run postman/collections/e2e-microservices.postman_collection.json \
            -e postman/environments/local.postman_environment.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export reports/index.html

      # Step 7: Execute k6 performance benchmark
      - name: Execute k6 Load Benchmark
        run: npm run test:load

      # Step 8: Store Newman report as a downloadable workflow artifact
      - name: Upload HTML Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: reports/index.html

      # Step 9: Publish live HTML report to GitHub Pages
      - name: Deploy Report to GitHub Pages
        if: github.ref == 'refs/heads/main' && always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports

      # Step 10: Clean up container resources
      - name: Tear Down Services
        if: always()
        run: docker compose down -v