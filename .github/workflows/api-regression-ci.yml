name: API Microservices Regression CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  api-automation-test:
    name: Build Services & Execute Newman Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Framework Dependencies
        run: npm ci || npm install

      - name: Spin up Microservices Cluster (Docker Compose)
        run: |
          docker compose up --build -d
          timeout 30s bash -c 'until curl -sf http://localhost:8080/health; do sleep 1; done'

      - name: Execute Newman Automation Tests
        run: |
          mkdir -p reports
          npx newman run postman/collections/e2e-microservices.postman_collection.json \
            -e postman/environments/local.postman_environment.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export reports/index.html

      - name: Upload HTML Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: reports/index.html

      - name: Deploy Report to GitHub Pages
        if: github.ref == 'refs/heads/main' && always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports

      - name: Tear Down Services
        if: always()
        run: docker compose down -v
